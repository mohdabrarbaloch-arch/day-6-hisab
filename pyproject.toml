[project]
name = "hisab"
version = "1.0.0"
description = "Hisab — Freelancer Invoice & Payment Tracker for South Asian freelancers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
