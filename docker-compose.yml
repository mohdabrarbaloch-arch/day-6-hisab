services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hisab
      POSTGRES_PASSWORD: hisab
      POSTGRES_DB: hisab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisab"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://hisab:hisab@db:5432/hisab
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
