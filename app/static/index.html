<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hisab — the freelancer's invoice & payment tracker. Send invoices in USD or PKR, chase overdue payments, and see your real income." />
  <title>Hisab — Invoice & Payment Tracker for Freelancers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>" />
</head>
<body>
  <div id="app"></div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status"></div>

  <!-- Invoice modal -->
  <div id="invoiceModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">New Invoice</h3>
        <button class="icon-btn" data-close-modal aria-label="Close">&times;</button>
      </div>
      <form id="invoiceForm">
        <label>Client
          <select id="invClient" required></select>
        </label>
        <div class="grid-2">
          <label>Currency
            <select id="invCurrency">
              <option value="USD">USD</option>
              <option value="PKR">PKR</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="AED">AED</option>
              <option value="SAR">SAR</option>
            </select>
          </label>
          <label>Due date
            <input type="date" id="invDue" required />
          </label>
        </div>
        <div id="itemRows"></div>
        <button type="button" class="btn ghost full" id="addItem">+ Add line item</button>
        <label>Notes
          <textarea id="invNotes" rows="2" placeholder="Payment terms, thank-you note…"></textarea>
        </label>
        <div class="modal-foot">
          <span class="muted">5% tax auto-applied</span>
          <button type="submit" class="btn primary">Create Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Client modal -->
  <div id="clientModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>New Client</h3>
        <button class="icon-btn" data-close-client aria-label="Close">&times;</button>
      </div>
      <form id="clientForm">
        <label>Name <input id="clientName" required minlength="2" placeholder="Jane Doe / Studio Nine" /></label>
        <label>Company <input id="clientCompany" placeholder="Optional" /></label>
        <label>Email <input type="email" id="clientEmail" placeholder="client@example.com" /></label>
        <label>Country <input id="clientCountry" placeholder="United States" /></label>
        <button type="submit" class="btn primary full">Save Client</button>
      </form>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
